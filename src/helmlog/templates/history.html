{% extends "base.html" %}
{% block title %}Session History — HelmLog{% endblock %}
{% block extra_css %}
<style>
.hist-tag-chip{display:inline-flex;align-items:center;gap:4px;padding:1px 6px;border-radius:10px;font-size:.7rem;border:1px solid var(--border);background:var(--bg-secondary);cursor:pointer;margin-right:4px;margin-bottom:3px}
.hist-tag-chip.active{background:var(--accent);color:var(--bg-primary)}
.hist-tag-chip .swatch{display:inline-block;width:8px;height:8px;border-radius:50%}
.hist-tag-chip .etype{font-size:.62rem;color:var(--text-secondary);margin-left:3px}
.hist-tag-chip.active .etype{color:var(--bg-primary);opacity:.75}
.hist-tag-row-chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.tag-mode-toggle{display:inline-flex;border:1px solid var(--border);border-radius:3px;overflow:hidden;margin-left:4px;vertical-align:middle}
.tag-mode-toggle button{font-size:.68rem;padding:2px 8px;border:none;background:transparent;color:var(--text-secondary);cursor:pointer}
.tag-mode-toggle button.active{background:var(--accent);color:var(--bg-primary)}
/* Video thumbnail (#827) — flags races that have a linked YouTube video. */
.hist-card-row{display:flex;gap:12px;align-items:flex-start}
.hist-card-main{flex:1;min-width:0}
.hist-video{flex:0 0 auto;display:block;width:128px;text-decoration:none;color:inherit}
.hist-video-frame{position:relative;display:block;border-radius:4px;overflow:hidden;border:1px solid var(--border);background:var(--bg-secondary)}
.hist-video img{display:block;width:100%;height:72px;object-fit:cover}
.hist-video-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:0;height:0;border-style:solid;border-width:7px 0 7px 12px;border-color:transparent transparent transparent #fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.9))}
.hist-video-more{display:block;font-size:.65rem;text-align:center;margin-top:2px;color:var(--text-secondary)}
/* Thumbnail failed to load (offline on the boat) — show a text badge instead
   of a broken image, so the card still reports that video exists. */
.hist-video-broken img,.hist-video-broken .hist-video-play{display:none}
.hist-video-broken .hist-video-frame::after{content:"\25B6\00A0Video";display:block;font-size:.72rem;text-align:center;padding:26px 4px;color:var(--text-secondary)}
@media (max-width:520px){.hist-video{width:96px}.hist-video img{height:54px}.hist-video-broken .hist-video-frame::after{padding:17px 4px}}
</style>
{% endblock %}

{% block content %}
<h1 style="margin-bottom:12px">Session History</h1>

<div class="card">
  <input id="q" class="event-input" placeholder="Search by name or event..."
    oninput="scheduleLoad()" style="margin-bottom:10px"/>
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
    <button class="filter-btn" onclick="setType(this,'')">All</button>
    <button class="filter-btn active" onclick="setType(this,'race')">Race</button>
    <button class="filter-btn" onclick="setType(this,'practice')">Practice</button>
    <button class="filter-btn" onclick="setType(this,'synthesized')">Synth</button>
  </div>
  <div style="display:flex;gap:8px;margin-bottom:10px">
    <div style="flex:1">
      <div class="label">From</div>
      <input id="from-date" type="date" class="event-input" onchange="load()"/>
    </div>
    <div style="flex:1">
      <div class="label">To</div>
      <input id="to-date" type="date" class="event-input" onchange="load()"/>
    </div>
  </div>
  <div id="tag-filter-row" style="display:none">
    <div class="label" style="display:flex;align-items:center;gap:6px">
      <span>Tags</span>
      <span id="tag-mode-wrap" style="display:none"></span>
      <a href="#" id="tag-clear" style="display:none;font-size:.7rem;color:var(--text-secondary)" onclick="event.preventDefault();clearTagFilter()">clear</a>
    </div>
    <div id="tag-filter-chips" class="hist-tag-row-chips"></div>
  </div>
</div>

<div id="results"></div>
<div id="pager" class="pager"></div>
{% endblock %}

{% block scripts %}
<script src="/static/history.js?v={{ git_sha }}"></script>
{% endblock %}
